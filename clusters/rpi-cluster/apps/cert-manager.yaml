apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/phil-harmoniq/homelab.git
    targetRevision: main
    path: clusters/rpi-cluster/manifests/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: default    # fallback; the auth cert declares its own namespace
  syncPolicy: {}
