apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/clusters/rpi-cluster/manifests/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/phil-harmoniq/homelab.git
      targetRevision: main
      ref: values
      path: clusters/rpi-cluster/manifests/monitoring
      directory:
        exclude: 'kube-prometheus-stack-values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - '.spec.parentRefs[].group'
        - '.spec.parentRefs[].kind'
        - '.spec.rules[].backendRefs[].group'
        - '.spec.rules[].backendRefs[].kind'
        - '.spec.rules[].backendRefs[].weight'
