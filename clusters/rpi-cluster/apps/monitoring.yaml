apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    # 1. kube-prometheus-stack Helm chart, configured by the values file from git
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/clusters/rpi-cluster/manifests/monitoring/kube-prometheus-stack-values.yaml
    # 2. git: values ref + extra manifests (grafana route, sealed secret),
    #    excluding the values file (not a k8s resource)
    - repoURL: https://github.com/phil-harmoniq/homelab.git
      targetRevision: main
      ref: values
      path: clusters/rpi-cluster/manifests/monitoring
      directory:
        exclude: 'kube-prometheus-stack-values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy: {}
