apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/phil-harmoniq/homelab.git
    targetRevision: main
    path: clusters/rpi-cluster/manifests/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy: {}
