apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fivelabs-wildcard
  namespace: default
spec:
  secretName: fivelabs-wildcard-tls
  issuerRef:
    name: letsencrypt-prod      # validate with staging first
    kind: ClusterIssuer
  dnsNames:
    - "fivelabs.tech"
    - "*.fivelabs.tech"
