apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-nightly
  namespace: default
spec:
  schedule: "0 0 8 * * *"        # 07:00 UTC = ~4 AM Eastern (3 AM in winter/EST)
  backupOwnerReference: self
  cluster:
    name: pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true                # also run one backup right now, to validate
