deploymentMode: Monolithic

loki:
  auth_enabled: false          # single-tenant; simpler for homelab
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-logs
      ruler: loki-logs
      admin: loki-logs
    s3:
      endpoint: http://10.1.1.2:9000
      region: us-east-1
      s3ForcePathStyle: true      # required for MinIO
      insecure: true              # plain HTTP (LAN, matches your accepted tradeoff)
      accessKeyId: 'REPLACE_WITH_LOKI_MINIO_ACCESS_KEY'
      secretAccessKey: 'REPLACE_WITH_LOKI_MINIO_SECRET_KEY'
  limits_config:
    retention_period: 168h        # 7 days
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true       # actually deletes expired logs
    delete_request_store: s3

# # credentials from the secret, exposed as env for the s3 config above
# extraEnvFrom:
#   - secretRef:
#       name: loki-minio-creds
# extraEnv:
#   - name: LOKI_ACCESS_KEY_ID
#     valueFrom:
#       secretKeyRef:
#         name: loki-minio-creds
#         key: access_key_id
#   - name: LOKI_SECRET_ACCESS_KEY
#     valueFrom:
#       secretKeyRef:
#         name: loki-minio-creds
#         key: secret_access_key

# Pi-appropriate footprint: single replica, modest resources
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  # give Loki room to start on slower ARM CPUs — the default 1s probe timeout is too tight
  livenessProbe:
    httpGet:
      path: /loki/api/v1/status/buildinfo
      port: http-metrics
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 6

# Zero out all the distributed-mode components (Monolithic only)
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
bloomGateway: { replicas: 0 }

# don't deploy the chart's bundled MinIO (deprecated; we use our own)
minio:
  enabled: false

# the chart's self-monitoring/canary add extra pods — off for a lean homelab
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
lokiCanary:
  enabled: false
test:
  enabled: false

# disable oversized cache pods — unnecessary at homelab log volume, and their
# large memory requests can't fit a single node (this caused the scheduling failure)
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# nginx gateway not needed for single-binary; Grafana queries Loki's service directly
gateway:
  enabled: false