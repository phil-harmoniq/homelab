apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
spec:
  blocks:
    - start: "10.1.1.200"
      stop: "10.1.1.250"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-l2
spec:
  loadBalancerIPs: true
  interfaces:
    - end0
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
