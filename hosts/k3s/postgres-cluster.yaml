apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ha-postgres-cluster
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised

  # Uses built-in local persistent path tracking on your external USB SSDs
  storage:
    size: 20Gi
    storageClass: "local-path"

  # Ensures structural node spreading across your 3 Pis
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: ha-postgres-cluster
