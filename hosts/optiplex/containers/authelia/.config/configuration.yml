theme: dark

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: '***REMOVED***'

authentication_backend:
  ldap:
    implementation: lldap

    address: 'ldaps://lldap.fivelabs.tech:636'
    timeout: 5s
    start_tls: false

    tls:
      skip_verify: false

    base_dn: 'dc=fivelabs,dc=tech'

    additional_users_dn: 'ou=people'
    users_filter: '(&({username_attribute}={input})(objectClass=person))'

    additional_groups_dn: 'ou=groups'
    groups_filter: '(member={dn})'

    user: 'uid=authelia,ou=people,dc=fivelabs,dc=tech'
    password: '***REMOVED***'

    attributes:
      username: uid
      display_name: displayName
      mail: mail
      group_name: cn

access_control:
  default_policy: deny

  rules:
    # Public app (no auth)
    - domain: 'public.fivelabs.tech'
      policy: bypass

    # User apps
    - domain: 'app.fivelabs.tech'
      subject:
        - 'group:users'
      policy: one_factor

    # Admin-only apps
    - domain: 'grafana.fivelabs.tech'
      subject:
        - 'group:admins'
      policy: one_factor

    # Catch-all for everything else
    - domain: '*.fivelabs.tech'
      subject:
        - 'group:users'
      policy: one_factor

session:
  name: authelia_session
  secret: '***REMOVED***'
  expiration: 1h
  inactivity: 5m
  domain: fivelabs.tech

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 10m

storage:
  encryption_key: '***REMOVED***'

  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt