alloy:
  configMap:
    content: |
      // discover all pods in the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // relabel: turn pod metadata into useful Loki labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // read the container log files from the node
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      // ship to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  # Loosened probes for slower ARM nodes under load (default 1s timeout too tight)
  livenessProbe:
    failureThreshold: 5
    httpGet:
      path: /-/ready
      port: 12345
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 5
    httpGet:
      path: /-/ready
      port: 12345
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5

  # Slightly higher requests so the agent isn't CPU-starved on the busy node
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      memory: 256Mi

# run as a DaemonSet (one per node)
controller:
  type: daemonset
