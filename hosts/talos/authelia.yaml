apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels: { app: authelia }
  template:
    metadata:
      labels: { app: authelia }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: copy-config
          image: authelia/authelia:4.39.20
          command: ["sh", "-c", "cp /config-ro/configuration.yml /config/configuration.yml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config-ro, mountPath: /config-ro, readOnly: true }
            - { name: data, mountPath: /config }
      containers:
        - name: authelia
          image: authelia/authelia:4.39.20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
              value: /secrets/jwt-secret
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/session-secret
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/storage-encryption-key
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
              value: /secrets/storage-db-password
            - name: AUTHELIA_SESSION_REDIS_PASSWORD_FILE
              value: /secrets/session-redis-password
            - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
              value: /secrets/ldap-password
          ports:
            - { name: http, containerPort: 9091 }
          volumeMounts:
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: data, mountPath: /config }
          readinessProbe:
            httpGet: { path: /api/health, port: 9091 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 9091 }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config-ro
          configMap: { name: authelia-config }
        - name: secrets
          secret: { secretName: authelia-secrets }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: auth
spec:
  selector: { app: authelia }
  ports:
    - { name: http, port: 9091, targetPort: 9091 }
