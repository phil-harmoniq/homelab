apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fivelabs-https-redirect
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      sectionName: http                # attach to the HTTP listener only
  hostnames:
    - "*.fivelabs.tech"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
