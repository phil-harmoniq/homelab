apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
      sectionName: https-fivelabs
  hostnames:
    - grafana.fivelabs.tech
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: prometheus-grafana
          port: 80
