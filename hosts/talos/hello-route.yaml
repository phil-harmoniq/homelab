apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      sectionName: https-fivelabs      # attach to the HTTPS listener only
  hostnames:
    - hello.fivelabs.tech
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: hello
          port: 80
