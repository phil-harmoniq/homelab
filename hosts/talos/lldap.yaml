apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels: { app: lldap }
  template:
    metadata:
      labels: { app: lldap }
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: lldap
          image: lldap/lldap:stable
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: LLDAP_LDAP_BASE_DN
              value: "dc=fivelabs,dc=tech"
            - name: LLDAP_HTTP_URL
              value: "https://lldap.fivelabs.tech"
            - name: LLDAP_JWT_SECRET
              valueFrom: { secretKeyRef: { name: lldap-secrets, key: jwt-secret } }
            - name: LLDAP_KEY_SEED
              valueFrom: { secretKeyRef: { name: lldap-secrets, key: key-seed } }
            - name: LLDAP_LDAP_USER_PASS
              valueFrom: { secretKeyRef: { name: lldap-secrets, key: ldap-user-pass } }
            - name: LLDAP_DATABASE_URL
              valueFrom: { secretKeyRef: { name: lldap-secrets, key: database-url } }
            # --- LDAPS ---
            - name: LLDAP_LDAPS_OPTIONS__ENABLED
              value: "true"
            - name: LLDAP_LDAPS_OPTIONS__PORT
              value: "6360"
            - name: LLDAP_LDAPS_OPTIONS__CERT_FILE
              value: "/certs/tls.crt"
            - name: LLDAP_LDAPS_OPTIONS__KEY_FILE
              value: "/certs/tls.key"
          ports:
            - { name: ldap, containerPort: 3890 }
            - { name: ldaps, containerPort: 6360 }
            - { name: http, containerPort: 17170 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: certs, mountPath: /certs, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: certs
          secret:
            secretName: fivelabs-wildcard-tls
---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: auth
spec:
  selector: { app: lldap }
  ports:
    - { name: ldap, port: 3890, targetPort: 3890 }
    - { name: http, port: 17170, targetPort: 17170 }
---
apiVersion: v1
kind: Service
metadata:
  name: lldap-ldaps-lb
  namespace: auth
  annotations:
    lbipam.cilium.io/ips: "10.1.1.201"
spec:
  type: LoadBalancer
  selector: { app: lldap }
  ports:
    - name: ldaps
      port: 636          # standard LDAPS port, exposed on the LAN
      targetPort: 6360   # LLDAP's actual listener
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
  namespace: auth
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
      sectionName: https-fivelabs
  hostnames:
    - lldap.fivelabs.tech
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: lldap
          port: 17170
